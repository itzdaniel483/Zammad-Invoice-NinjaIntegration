<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integration Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent 40%),
                              radial-gradient(circle at bottom left, #0f172a, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 0.5rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            margin-top: 2rem;
        }

        .toggle-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 0.875rem;
        }

        .toggle-info p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(2px);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Zammad Billing Settings</h1>
                <p>Configure your Invoice Ninja integration</p>
            </div>
            
            <form id="settingsForm">
                <div class="form-group">
                    <label>Invoice Ninja URL</label>
                    <input type="text" id="invoice_ninja_url" placeholder="https://invoice.example.com" required>
                </div>
                
                <div class="form-group">
                    <label>API Token</label>
                    <input type="password" id="invoice_ninja_api_token" placeholder="Your secret API token" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem;">
                    <div class="form-group">
                        <label>Hourly Rate ($)</label>
                        <input type="number" step="0.01" id="hourly_rate" required>
                    </div>
                    <div class="form-group">
                        <label>Due In (Days)</label>
                        <input type="number" id="due_date_days" required>
                    </div>
                </div>

                <div class="toggle-group">
                    <div class="toggle-info">
                        <h3>Auto-Send Invoices</h3>
                        <p>Automatically email the client when ticket is closed</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="auto_send">
                        <span class="slider"></span>
                    </label>
                </div>

                <button type="submit">Save Configuration</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast">Settings saved successfully!</div>

    <script>
        // Load initial settings
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                document.getElementById('invoice_ninja_url').value = data.invoice_ninja_url || '';
                document.getElementById('invoice_ninja_api_token').value = data.invoice_ninja_api_token || '';
                document.getElementById('hourly_rate').value = data.hourly_rate || 50.0;
                document.getElementById('due_date_days').value = data.due_date_days || 14;
                document.getElementById('auto_send').checked = data.auto_send || false;
            });

        // Save settings
        document.getElementById('settingsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const payload = {
                invoice_ninja_url: document.getElementById('invoice_ninja_url').value,
                invoice_ninja_api_token: document.getElementById('invoice_ninja_api_token').value,
                hourly_rate: parseFloat(document.getElementById('hourly_rate').value),
                due_date_days: parseInt(document.getElementById('due_date_days').value, 10),
                auto_send: document.getElementById('auto_send').checked
            };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            });
        });
    </script>
</body>
</html>
